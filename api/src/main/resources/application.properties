spring.application.name=api
server.port=8080

# Active Profile (dev enables DataInitializer and H2 Console)
spring.profiles.active=dev

# Database Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:digitalbookingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Restricted by Profile and Spring Security)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Allow H2 Console Frame Options (so it can load in an iframe)
spring.headers.frame-options.disable=true

# Jackson Deserialization Safeguards
spring.jackson.deserialization.fail-on-null-for-primitives=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# JWT Configuration
app.jwt.secret=DigitalBookingSuperSecretKeyWithAtLeast256BitsLengthForHmacSha256Security123456
app.jwt.expiration-ms=86400000
app.jwtSecret=DigitalBookingSuperSecretKeyWithAtLeast256BitsLengthForHmacSha256Security123456
app.jwtExpirationMs=86400000
